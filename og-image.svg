    <circle cx="80" cy="560" r="2"/><circle cx="160" cy="560" r="2"/><circle cx="240" cy="560" r="2"/><circle cx="320" cy="560" r="2"/><circle cx="400" cy="560" r="2"/><circle cx="480" cy="560" r="2"/><circle cx="560" cy="560" r="2"/><circle cx="640" cy="560" r="2"/><circle cx="720" cy="560" r="2"/><circle cx="800" cy="560" r="2"/><circle cx="880" cy="560" r="2"/><circle cx="960" cy="560" r="2"/><circle cx="1040" cy="560" r="2"/><circle cx="1120" cy="560" r="2"/>
